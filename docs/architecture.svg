<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">RescueRelay architecture</title>
  <desc id="desc">An idempotent inbox event starts a FastAPI and Strands agent workflow. A guarded four-tool loop uses deterministic matching and an evidence ledger. Human approvals control commitments. Amazon Bedrock and AgentCore provide the production path.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173b31" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#759083"/>
    </marker>
    <style>
      .title{font:600 52px Georgia,serif;fill:#173b31}.sub{font:400 20px Arial,sans-serif;fill:#738079}
      .lane{font:700 15px Arial,sans-serif;letter-spacing:2px;fill:#819087}.box-title{font:600 22px Georgia,serif;fill:#173b31}
      .body{font:400 16px Arial,sans-serif;fill:#67766e}.mini{font:700 13px Arial,sans-serif;letter-spacing:.5px;fill:#365648}
      .line{fill:none;stroke:#759083;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:9 9}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f7f5ef"/>
  <rect x="0" y="0" width="26" height="900" fill="#163d30"/>
  <text x="88" y="90" class="title">RescueRelay architecture</text>
  <text x="90" y="126" class="sub">Model-orchestrated. Deterministic where correctness matters. Human-owned at the commitment boundary.</text>

  <text x="90" y="197" class="lane">COORDINATOR EXPERIENCE</text>
  <rect x="90" y="220" rx="14" width="320" height="176" fill="#fffefa" stroke="#d7dbd3" filter="url(#shadow)"/>
  <circle cx="132" cy="264" r="20" fill="#e6eee7"/><path d="M123 266h18M126 258h12M128 274h8" stroke="#38634f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="166" y="271" class="box-title">React rescue desk</text>
  <text x="122" y="316" class="body">Offers · linked evidence · impact</text>
  <text x="122" y="347" class="body">Two precise human decisions</text>
  <rect x="122" y="365" rx="10" width="242" height="42" fill="#e46f38"/>
  <text x="141" y="392" font-family="Arial" font-size="14" font-weight="700" fill="white">SIMULATE OFFER ARRIVAL</text>

  <text x="506" y="197" class="lane">APPLICATION + AGENT</text>
  <rect x="506" y="220" rx="14" width="630" height="470" fill="#fffefa" stroke="#d7dbd3" filter="url(#shadow)"/>
  <rect x="538" y="252" rx="10" width="566" height="72" fill="#173f32"/>
  <text x="566" y="284" font-family="Georgia" font-size="22" font-weight="600" fill="#fff">Event intake + Strands Agent</text>
  <text x="566" y="307" font-family="Arial" font-size="14" fill="#bdd0c5">durable receipt · idempotent claim · background execution</text>

  <rect x="538" y="352" rx="10" width="178" height="104" fill="#edf3ed" stroke="#ccdbd0"/>
  <text x="560" y="384" class="mini">MODEL ADAPTER</text>
  <text x="560" y="413" class="body">Demo replay</text><text x="560" y="438" class="body">or BedrockModel</text>
  <path d="M716 404h54" class="line"/>
  <rect x="770" y="352" rx="10" width="302" height="104" fill="#f8ede3" stroke="#e8c9b5"/>
  <text x="793" y="384" class="mini">DEFAULT-DENY HOOK</text>
  <text x="793" y="413" class="body">Only four read / plan / draft</text>
  <text x="793" y="438" class="body">tools can execute</text>

  <path d="M920 456v45" class="line"/>
  <rect x="538" y="501" rx="10" width="534" height="79" fill="#f2f0e8" stroke="#ddd9cd"/>
  <text x="563" y="532" class="mini">STRANDS TOOL LOOP</text>
  <text x="563" y="558" class="body">Read inbox  →  Load constraints  →  Optimize  →  Stage messages</text>

  <path d="M805 580v42" class="line"/>
  <rect x="538" y="622" rx="10" width="534" height="42" fill="#e2ece3" stroke="#c8d8cb"/>
  <text x="564" y="649" class="mini">DETERMINISTIC MATCHER · NEED + CAPACITY + HOURS + DISTANCE</text>

  <text x="1230" y="197" class="lane">EVIDENCE + EFFECTS</text>
  <rect x="1230" y="220" rx="14" width="280" height="210" fill="#fffefa" stroke="#d7dbd3" filter="url(#shadow)"/>
  <text x="1260" y="264" class="box-title">Run ledger</text>
  <text x="1260" y="302" class="body">Event receipts + source records</text><text x="1260" y="331" class="body">Tool timings + failures</text>
  <text x="1260" y="360" class="body">Dispatch + impact state</text>
  <rect x="1260" y="384" rx="8" width="137" height="30" fill="#e6eee7"/>
  <text x="1277" y="404" class="mini">SQLITE / STORE</text>

  <rect x="1230" y="480" rx="14" width="280" height="210" fill="#173f32" filter="url(#shadow)"/>
  <text x="1260" y="526" font-family="Georgia" font-size="23" font-weight="600" fill="#fff">Human approval</text>
  <text x="1260" y="566" font-family="Arial" font-size="16" fill="#bfd0c6">Only this state machine</text>
  <text x="1260" y="594" font-family="Arial" font-size="16" fill="#bfd0c6">can create a commitment</text>
  <line x1="1260" y1="621" x2="1480" y2="621" stroke="#567568"/>
  <text x="1260" y="655" font-family="Arial" font-size="14" font-weight="700" fill="#f2ce75">NO SEND TOOL EXISTS</text>

  <path d="M410 308h96" class="line"/>
  <path d="M1136 308h94" class="line"/>
  <path d="M1230 585h-94" class="line"/>
  <path d="M1370 430v50" class="line"/>

  <rect x="90" y="752" rx="14" width="1420" height="90" fill="#eee9dc" stroke="#ddd4c4"/>
  <text x="122" y="787" class="lane">AWS PRODUCTION PATH</text>
  <text x="122" y="820" class="body">Inbox event → IAM AgentCore Runtime</text>
  <path d="M438 811h91" class="line dash"/>
  <text x="559" y="820" class="body">Strands BedrockModel</text>
  <path d="M773 811h91" class="line dash"/>
  <text x="895" y="820" class="body">CloudWatch + OpenTelemetry traces</text>
  <text x="1364" y="820" font-family="Arial" font-size="13" font-weight="700" fill="#9c5e39">LIVE MODE</text>
</svg>
